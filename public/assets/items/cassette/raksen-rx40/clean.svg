<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Raksen RX-40 temiz kasetçalar</title>
  <desc id="desc">1990'lardan kalma, iki hoparlörlü, koyu gri taşınabilir stereo kasetçalar.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4f49"/>
      <stop offset=".5" stop-color="#2f332e"/>
      <stop offset="1" stop-color="#1d201c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#777b71"/>
      <stop offset="1" stop-color="#4a4d46"/>
    </linearGradient>
    <radialGradient id="speaker" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#282a26"/>
      <stop offset=".7" stop-color="#121311"/>
      <stop offset="1" stop-color="#050605"/>
    </radialGradient>
    <pattern id="mesh" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.2" fill="#4a4e47"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="15" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfc8b3" stop-opacity=".55"/>
      <stop offset=".35" stop-color="#7e8279" stop-opacity=".18"/>
      <stop offset="1" stop-color="#292b27" stop-opacity=".5"/>
    </linearGradient>
  </defs>

  <ellipse cx="380" cy="370" rx="300" ry="30" fill="#0a0a08" opacity=".28"/>
  <g filter="url(#shadow)">
    <!-- Handle -->
    <path d="M216 92V55c0-23 18-41 41-41h246c23 0 41 18 41 41v37" fill="none" stroke="#20231f" stroke-width="28" stroke-linecap="round"/>
    <path d="M229 83V59c0-14 11-25 25-25h252c14 0 25 11 25 25v24" fill="none" stroke="#555950" stroke-width="8" stroke-linecap="round"/>

    <!-- Main chassis -->
    <rect x="70" y="78" width="620" height="274" rx="28" fill="url(#body)" stroke="#0e100d" stroke-width="12"/>
    <rect x="89" y="98" width="582" height="35" rx="8" fill="#181a17"/>
    <text x="118" y="122" fill="#d8d4c5" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">RAKSEN</text>
    <text x="577" y="121" fill="#a6a89d" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">RX-40</text>

    <!-- Radio scale -->
    <rect x="225" y="105" width="310" height="22" rx="4" fill="#9c9a88"/>
    <path d="M242 116h273" stroke="#3b3d38" stroke-width="2"/>
    <g stroke="#3b3d38" stroke-width="1">
      <path d="M255 110v12M286 112v8M318 110v12M351 112v8M384 110v12M417 112v8M450 110v12M483 112v8"/>
    </g>
    <rect x="401" y="107" width="3" height="18" fill="#9f3f32"/>

    <!-- Speakers -->
    <g>
      <circle cx="190" cy="233" r="91" fill="url(#speaker)" stroke="#0a0b09" stroke-width="12"/>
      <circle cx="190" cy="233" r="77" fill="url(#mesh)" opacity=".95"/>
      <circle cx="570" cy="233" r="91" fill="url(#speaker)" stroke="#0a0b09" stroke-width="12"/>
      <circle cx="570" cy="233" r="77" fill="url(#mesh)" opacity=".95"/>
      <circle cx="190" cy="233" r="18" fill="#11120f" stroke="#5e6259" stroke-width="4"/>
      <circle cx="570" cy="233" r="18" fill="#11120f" stroke="#5e6259" stroke-width="4"/>
    </g>

    <!-- Cassette bay -->
    <rect x="300" y="154" width="160" height="154" rx="10" fill="#111310" stroke="#666b61" stroke-width="7"/>
    <rect x="316" y="174" width="128" height="108" rx="6" fill="url(#glass)" stroke="#242622" stroke-width="4"/>
    <rect x="336" y="199" width="88" height="59" rx="5" fill="#b5ad97" opacity=".78"/>
    <circle cx="357" cy="229" r="15" fill="#2d2f2a" stroke="#d6ccb1" stroke-width="5"/>
    <circle cx="403" cy="229" r="15" fill="#2d2f2a" stroke="#d6ccb1" stroke-width="5"/>
    <path d="M372 225h16" stroke="#4d4f49" stroke-width="4"/>
    <text x="380" y="294" text-anchor="middle" fill="#9da096" font-family="Arial, sans-serif" font-size="11" letter-spacing="2">AUTO STOP</text>

    <!-- Top buttons -->
    <g fill="url(#panel)" stroke="#171915" stroke-width="3">
      <rect x="267" y="65" width="34" height="24" rx="4"/>
      <rect x="307" y="65" width="34" height="24" rx="4"/>
      <rect x="347" y="65" width="34" height="24" rx="4"/>
      <rect x="387" y="65" width="34" height="24" rx="4"/>
      <rect x="427" y="65" width="34" height="24" rx="4"/>
      <rect x="467" y="65" width="34" height="24" rx="4"/>
    </g>

    <!-- Knobs / small details -->
    <circle cx="622" cy="157" r="19" fill="#151714" stroke="#73776c" stroke-width="4"/>
    <circle cx="622" cy="157" r="6" fill="#929589"/>
    <circle cx="655" cy="157" r="13" fill="#151714" stroke="#73776c" stroke-width="4"/>
    <path d="M112 323h536" stroke="#6c7067" stroke-opacity=".42" stroke-width="3"/>
    <rect x="105" y="335" width="54" height="8" rx="3" fill="#11120f"/>
    <rect x="601" y="335" width="54" height="8" rx="3" fill="#11120f"/>
  </g>
</svg>
